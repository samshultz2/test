<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LessonPay</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f4f8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 3rem 4rem;
      text-align: center;
      max-width: 480px;
    }
    h1 { color: #1e293b; margin-bottom: 0.5rem; }
    p  { color: #64748b; font-size: 0.95rem; }
    .badge {
      display: inline-block;
      background: #e0f2fe;
      color: #0369a1;
      border-radius: 20px;
      padding: 4px 16px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">LessonPay API</div>
    <h1>LessonPay</h1>
    <p>Private Tuition Payment Tracker &mdash; Flask backend running successfully.</p>
    <p style="margin-top:1rem;font-size:0.8rem;color:#94a3b8;">
      Connect your frontend to <code>/api/</code> and authenticate via <code>/auth/login</code>.
    </p>
  </div>
</body>
</html>
